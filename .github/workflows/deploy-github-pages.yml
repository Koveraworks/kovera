name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      demo_mode:
        description: 'Demo mode: build without Supabase, so signups are shown but not saved (for previews of unreleased forms)'
        type: boolean
        default: false
  # Uncomment the following lines if you want every push to main to automatically deploy to GitHub Pages:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Build with Vite
        run: npm run build
        env:
          # A project site lives under a subpath (koveraworks.github.io/kovera/);
          # configure-pages reports it, e.g. "/kovera".
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_DEMO_MODE: ${{ inputs.demo_mode && 'true' || '' }}
          VITE_SUPABASE_URL: ${{ !inputs.demo_mode && secrets.VITE_SUPABASE_URL || '' }}
          VITE_SUPABASE_ANON_KEY: ${{ !inputs.demo_mode && secrets.VITE_SUPABASE_ANON_KEY || '' }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
